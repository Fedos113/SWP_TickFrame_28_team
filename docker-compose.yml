services:
  # ==========================================
  # 0. POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: tickframe_postgres
    environment:
      POSTGRES_DB: tickframe
      POSTGRES_USER: tickframe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tickframe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickframe -d tickframe"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ==========================================
  # 1. MAIN BACKEND (Your original code)
  # ==========================================
  tickframe:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Live-reload mounts — changes to source files are reflected immediately,
      # no rebuild needed for frontend/backend code (only rebuild for new pip deps).
      - ./tickframe/frontend:/app/tickframe/frontend
      - ./tickframe/backend:/app/tickframe/backend

  # ==========================================
  # 2. MACHINE LEARNING MICROSERVICE
  # ==========================================
  ml-service:
    build: ./ml_service
    container_name: ml_service_container
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service/logs:/code/logs
    restart: always

volumes:
  pgdata:
